plugins {
    id 'java-library'
    id 'io.qameta.allure' version '2.12.0'
}

repositories {
    mavenCentral()
}

def selenideVersion = "7.13.0"
def allureVersion = "2.32.0"
def junitVersion = "5.14.1"
def slf4jVersion = "2.0.17"

allure {
    version.set(allureVersion)
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}

dependencies {
    testImplementation (
            "com.codeborne:selenide:$selenideVersion",
            "org.junit.jupiter:junit-jupiter:$junitVersion",
            "org.slf4j:slf4j-simple:$slf4jVersion",
            "io.qameta.allure:allure-junit5:$allureVersion",
            "io.qameta.allure:allure-selenide:$allureVersion"  // <--- ДОБАВЬТЕ ЭТУ ЗАВИСИМОСТЬ
    )
}

tasks.withType(Test) {
    useJUnitPlatform()

    systemProperty "allure.results.directory", "build/allure-results"

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
        showStandardStreams = true
        events = ["PASSED", "FAILED", "SKIPPED", "STARTED"]
    }
}